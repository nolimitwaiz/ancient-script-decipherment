[project]
name = "decipherment-bench"
version = "0.0.1"
description = "From-scratch visual decipherment research stack: pixel MT, OT decipherment, quant epistemics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Waiz Khan", email = "waizkhan008@gmail.com" }]
dependencies = [
    "datasets>=5.0.1",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "sacrebleu>=2.6.0",
    "sentencepiece>=0.2.2",
    "torch==2.4.1; platform_system == 'Linux'",
    "torch>=2.13.0; platform_system == 'Darwin'",
]

[project.scripts]
glyphos-ledger = "glyphos.ledger.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "pypdf>=4.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu118", marker = "platform_system == 'Linux'" }]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glyphos"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["contrib"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001 flags non-Latin string literals as "ambiguous" — this repo legitimately
# contains Coptic/Hebrew/hieroglyphic text. Docstring/comment variants stay on.
ignore = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
